<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C1 → C2: One Attack, Two Vantage Points</title>
<style>
:root{color-scheme:light dark;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --border:rgba(11,11,11,0.14); --reject:#d03b3b; --accept:#0ca30c; --gap:#2a78d6}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --border:rgba(255,255,255,0.16); --reject:#e66767; --accept:#0ca30c; --gap:#3987e5}}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
  --border:rgba(255,255,255,0.16); --reject:#e66767; --accept:#0ca30c; --gap:#3987e5}
body{margin:0;background:var(--page);color:var(--ink);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:30px 16px 50px}
figure{max-width:940px;margin:0 auto}
svg{max-width:100%;height:auto;color:var(--ink)}
figcaption{color:var(--ink2);margin-top:14px;max-width:78ch}
</style>
</head>
<body>
<figure>
<svg viewBox="0 0 940 600" role="img"
  aria-label="One fabricated batch is checked from two vantage points. In data space, physics invariants reject conservation scaling, channel roll and within-regime permutation, while regime splicing slips under the batch threshold. In update space, the update trained on the same fabrication is accepted by FedAvg, median and norm clipping, while Krum rejects it and trimmed mean and FLTrust partially filter it. The disagreement between the two verdicts is the security gap.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
  </defs>

  <!-- source: the attacks -->
  <rect x="20" y="235" width="200" height="130" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="120" y="262" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Fabricated batch</text>
  <text x="120" y="281" text-anchor="middle" font-size="12" fill="var(--ink2)">Recipe A attacks:</text>
  <text x="120" y="299" text-anchor="middle" font-size="12" fill="currentColor">conservation scaling</text>
  <text x="120" y="315" text-anchor="middle" font-size="12" fill="currentColor">channel roll · permutation</text>
  <text x="120" y="333" text-anchor="middle" font-size="12" fill="var(--ink2)">regime splicing</text>
  <text x="120" y="349" text-anchor="middle" font-size="11" fill="var(--muted)">(stats preserved, physics broken)</text>

  <!-- lane frames -->
  <rect x="255" y="24" width="580" height="216" rx="12" fill="none" stroke="var(--border)" stroke-dasharray="5 4"/>
  <text x="272" y="50" font-size="11" letter-spacing="1.5" fill="var(--muted)">DATA SPACE · PRIVATE TO THE CLIENT · CRITERION 1</text>

  <rect x="255" y="300" width="580" height="276" rx="12" fill="none" stroke="var(--border)" stroke-dasharray="5 4"/>
  <text x="272" y="326" font-size="11" letter-spacing="1.5" fill="var(--muted)">UPDATE SPACE · ALL THE SERVER SEES · CRITERION 2</text>

  <!-- top path: physics check -->
  <rect x="320" y="72" width="210" height="100" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="425" y="99" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Physics invariants</text>
  <text x="425" y="118" text-anchor="middle" font-size="12" fill="var(--ink2)">6 couplings + 4 balances,</text>
  <text x="425" y="134" text-anchor="middle" font-size="12" fill="var(--ink2)">mined from clean data;</text>
  <text x="425" y="150" text-anchor="middle" font-size="12" fill="var(--ink2)">row ε, batch threshold</text>

  <rect x="655" y="66" width="160" height="88" rx="10" fill="none" stroke="var(--reject)" stroke-width="2"/>
  <text x="735" y="92" text-anchor="middle" font-size="14" font-weight="650" fill="var(--reject)">REJECTED</text>
  <text x="735" y="112" text-anchor="middle" font-size="12" fill="var(--ink2)">scaling · roll ·</text>
  <text x="735" y="128" text-anchor="middle" font-size="12" fill="var(--ink2)">permutation</text>
  <text x="735" y="146" text-anchor="middle" font-size="11" fill="var(--muted)">bulk violations, caught</text>

  <!-- splicing bypass -->
  <rect x="655" y="176" width="160" height="48" rx="8" fill="none" stroke="var(--reject)" stroke-width="1.2" stroke-dasharray="5 4"/>
  <text x="735" y="196" text-anchor="middle" font-size="12" font-weight="600" fill="currentColor">regime splicing slips in</text>
  <text x="735" y="213" text-anchor="middle" font-size="11" fill="var(--muted)">seam rows &lt; threshold</text>
  <path d="M480,172 C540,215 590,200 647,200" fill="none" stroke="var(--muted)" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#a)" color="var(--muted)"/>

  <!-- bottom path: training then defences -->
  <rect x="320" y="366" width="140" height="86" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="390" y="399" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Local training</text>
  <text x="390" y="418" text-anchor="middle" font-size="12" fill="var(--ink2)">autoencoder,</text>
  <text x="390" y="434" text-anchor="middle" font-size="12" fill="var(--ink2)">update Δ emitted</text>

  <rect x="495" y="366" width="120" height="86" rx="10" fill="none" stroke="currentColor" stroke-width="1.5"/>
  <text x="555" y="396" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">Robust</text>
  <text x="555" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="currentColor">aggregation</text>
  <text x="555" y="434" text-anchor="middle" font-size="12" fill="var(--ink2)">inspects Δ only</text>

  <rect x="655" y="352" width="160" height="88" rx="10" fill="none" stroke="var(--accept)" stroke-width="2"/>
  <text x="735" y="378" text-anchor="middle" font-size="14" font-weight="650" fill="var(--accept)">ACCEPTED</text>
  <text x="735" y="398" text-anchor="middle" font-size="12" fill="var(--ink2)">FedAvg · median ·</text>
  <text x="735" y="414" text-anchor="middle" font-size="12" fill="var(--ink2)">norm clipping</text>
  <text x="735" y="432" text-anchor="middle" font-size="11" fill="var(--muted)">Δ looks benign</text>

  <rect x="655" y="500" width="160" height="60" rx="8" fill="none" stroke="var(--border)" stroke-width="1.2"/>
  <text x="735" y="522" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink2)">filtered or partial</text>
  <text x="735" y="540" text-anchor="middle" font-size="11" fill="var(--muted)">Krum · trimmed mean · FLTrust</text>
  <path d="M615,440 C635,470 640,510 647,522" fill="none" stroke="var(--muted)" stroke-width="1.2" marker-end="url(#a)" color="var(--muted)"/>

  <!-- arrows from source -->
  <path d="M220,265 C260,245 275,150 312,128" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="256" y="192" font-size="12" fill="var(--ink2)">audited</text>

  <path d="M220,335 C260,355 275,385 312,400" fill="none" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="250" y="376" font-size="12" fill="var(--ink2)">trained on</text>

  <line x1="530" y1="110" x2="647" y2="110" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="588" y="101" text-anchor="middle" font-size="12" fill="var(--ink2)">violates</text>

  <line x1="460" y1="409" x2="487" y2="409" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="474" y="400" text-anchor="middle" font-size="12" fill="var(--ink2)">Δ</text>

  <line x1="615" y1="396" x2="647" y2="396" stroke="currentColor" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- the gap -->
  <line x1="735" y1="238" x2="735" y2="338" stroke="var(--gap)" stroke-width="2" stroke-dasharray="6 4"
    marker-start="url(#a)" marker-end="url(#a)" color="var(--gap)"/>
  <rect x="756" y="258" width="170" height="58" rx="8" fill="var(--surface)" stroke="var(--gap)" stroke-width="1.5"/>
  <text x="841" y="281" text-anchor="middle" font-size="12.5" font-weight="650" fill="var(--gap)">THE GAP</text>
  <text x="841" y="299" text-anchor="middle" font-size="11.5" fill="var(--ink2)">same attack (channel roll),</text>
  <text x="841" y="299" dy="14" text-anchor="middle" font-size="11.5" fill="var(--ink2)">opposite verdicts</text>
</svg>
<figcaption><strong>The C1 → C2 pincer, with the actors placed.</strong> The attacks (Recipe A) enter at
the left. In data space, the mined invariants — six actuator–flow couplings and four tank mass balances —
reject scaling, roll and permutation on bulk violations, while regime splicing slips under the batch
threshold via its seam-only violations (the disclosed evasion). In update space, the update trained on the
same fabrication (channel roll in the pilot) meets six aggregation rules with a split verdict: FedAvg,
coordinate-wise median and norm clipping accept it outright; Krum filters it, and trimmed mean and FLTrust
accept only partially. The criterion was fixed in the evaluation protocol as "at least three of six accept" — the gap needs
widely-deployed rules to be blind, not all of them. C3 then shows the accepted poison does damage; C4 asks
whether the gap survives an attacker who knows about the physics gate.</figcaption>
</figure>
</body>
</html>
